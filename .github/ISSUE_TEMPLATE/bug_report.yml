name: "🐛 Bug Report"
description: "Report a problem, glitch, or unexpected behavior in Casual Maze Game"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible so we can reproduce and fix it.
        You can also export your **Save State** from the Hub or copy your **Debug Log** directly from the in-game Pause menu (`[P]` -> `Copy Debug Log`).

  - type: input
    id: level_id
    attributes:
      label: "Level ID or Name"
      description: "Which level or saga were you playing? (e.g., Level 1, Chapter 8 / Level 30, Story 3 Whispering Citadel, or Custom)"
      placeholder: "e.g., Chapter 8 Level 30 (The Hidden Underpass)"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: "Browser"
      description: "Which browser were you using?"
      options:
        - "Chrome"
        - "Firefox"
        - "Safari"
        - "Edge"
        - "Brave"
        - "Mobile Browser (iOS Safari / Android Chrome)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Which operating system are you using?"
      options:
        - "Windows"
        - "macOS"
        - "Linux"
        - "iOS"
        - "Android"
        - "ChromeOS"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      description: "A clear and concise description of the bug or glitch."
      placeholder: "When I rotated the camera 90 degrees while on the bridge..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "How can someone else reproduce the issue?"
      value: |
        1. Go to '...'
        2. Move to '...'
        3. Trigger '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
      placeholder: "I expected the player to walk under the bridge..."
    validations:
      required: false

  - type: textarea
    id: debug_log_or_save
    attributes:
      label: "Debug Log / Save State JSON (Recommended)"
      description: |
        Attach or paste your exported Debug Log JSON or Save State JSON.
        - **Debug Log**: In game, press `[P]` (Pause Menu) and click **"📋 Copy Debug Log"** or **"💾 Download Debug Log"**.
        - **Save State**: On the Hub, click **"💾 Save Progress"**.
      placeholder: "Paste JSON payload here..."
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "Diagnostics Check"
      options:
        - label: "I verified whether this occurs on the latest version of the game."
          required: false
