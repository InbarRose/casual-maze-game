name: CI & Automated Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate & Test (Node 20 LTS)
    runs-on: ubuntu-latest

    # Casual Maze Game is a 100% static client-side browser game hosted on GitHub Pages.
    # Node.js is only used for local test execution and static linting.
    # Node 20.x is pre-cached on ubuntu-latest runners for fastest build times (sub-second setup)
    # without running redundant multi-version matrices.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS (Fast Pre-Cached Runner)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate Static Architecture & Assets
        run: npm run validate:static

      - name: Validate Asset, Level & Version Drift Integrity
        run: npm run validate:drift

      - name: Validate ES Module & Syntax Integrity
        run: npm run validate:syntax

      - name: Run Core & Engine Subsystem Tests
        run: |
          npm run test:core
          npm run test:engine
          npm run test:entities

      - name: Run Editor Studio & UI Component Tests
        run: |
          npm run test:editor
          npm run test:ui

      - name: Run Level Solvers & Campaign Megalabyrinth Tests
        run: |
          npm run test:levels
          npm run test:campaign

      - name: Run End-to-End User Journey Tests
        run: npm run test:journeys

      - name: Run Headless UI & Browser E2E Tests (PR Quality Gate)
        run: npm run test:e2e

      - name: Run Full Master Test Suite & Assert 100% Pass Rate
        run: npm test
