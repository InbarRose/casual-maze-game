name: CI & Automated Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Test Matrix (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate Static Architecture & Assets
        run: npm run validate:static

      - name: Validate ES Module & Syntax Integrity
        run: npm run validate:syntax

      - name: Run Subsystem Unit Tests
        run: npm run test:unit

      - name: Run End-to-End User Journey Tests
        run: npm run test:journeys

      - name: Run Full Master Test Suite
        run: npm test
