<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 2.5D Angled Dungeon Wall (Top Cap + Front Drop Facade) -->
  <!-- Ground Cast Shadow -->
  <rect x="0" y="52" width="64" height="12" fill="#000000" opacity="0.35" />
  <!-- Front Vertical Drop Facade -->
  <rect x="0" y="24" width="64" height="32" fill="#334155" stroke="#1e293b" stroke-width="2" />
  <!-- Brick Courses & Mortar Joints -->
  <line x1="0" y1="35" x2="64" y2="35" stroke="#1e293b" stroke-width="1.5" />
  <line x1="0" y1="46" x2="64" y2="46" stroke="#1e293b" stroke-width="1.5" />
  <line x1="22" y1="24" x2="22" y2="35" stroke="#1e293b" stroke-width="1.5" />
  <line x1="44" y1="24" x2="44" y2="35" stroke="#1e293b" stroke-width="1.5" />
  <line x1="11" y1="35" x2="11" y2="46" stroke="#1e293b" stroke-width="1.5" />
  <line x1="33" y1="35" x2="33" y2="46" stroke="#1e293b" stroke-width="1.5" />
  <line x1="55" y1="35" x2="55" y2="46" stroke="#1e293b" stroke-width="1.5" />
  <!-- Elevated Top Cap (Angled Oblique Face) -->
  <polygon points="0,0 64,0 64,24 0,24" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
  <line x1="0" y1="2" x2="64" y2="2" stroke="#cbd5e1" stroke-width="1.5" />
</svg>
