  <circle cx="34" cy="16" r="9" fill="#fed7aa" />
  <!-- Eye -->
  <ellipse cx="39.5" cy="15.5" rx="1.5" ry="1.8" fill="#0f172a" />
  <circle cx="40" cy="15" r="0.5" fill="#ffffff" />
  <!-- Nose ridge silhouette -->
  <path d="M 42 16 L 44 17.5 L 42 19" fill="none" stroke="#fdba74" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Messy Brown Hair Profile -->
  <path d="M 26 16 C 26 8 42 7 42 13 C 40 10 37 8 33 8 C 29 8 26 12 26 16 Z" fill="#451a03" />
  <path d="M 25 15 C 23 18 24 21 26 21 C 27 19 28 17 28 15 Z" fill="#451a03" />
