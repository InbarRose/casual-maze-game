  <!-- Checks -->
  <rect x="26" y="27" width="16" height="3" fill="#991b1b" />
  <rect x="26" y="33" width="16" height="3" fill="#991b1b" />
  <rect x="31" y="24" width="3.5" height="13" fill="#991b1b" />
  <rect x="37" y="24" width="3.5" height="13" fill="#991b1b" />
  <rect x="31" y="27" width="3.5" height="3" fill="#1e293b" />
  <rect x="37" y="27" width="3.5" height="3" fill="#1e293b" />

