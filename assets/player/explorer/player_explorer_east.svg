  <rect x="18" y="17" width="2.5" height="6" fill="#451a03" />

  <!-- Hiking Boots (Profile) -->
  <rect x="23" y="49" width="12" height="7" rx="2" fill="#5c2e0b" stroke="#271304" stroke-width="1.5" />
  <rect x="22" y="53" width="14" height="3" rx="1" fill="#271304" />
  <rect x="33" y="49" width="12" height="7" rx="2" fill="#5c2e0b" stroke="#271304" stroke-width="1.5" />
  <rect x="32" y="53" width="14" height="3" rx="1" fill="#271304" />

  <!-- Blue Jeans (Profile Stride) -->
