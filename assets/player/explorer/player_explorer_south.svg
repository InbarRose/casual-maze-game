<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Explorer Character: South Facing (Front View) -->
  <!-- Drop Shadow -->
  <ellipse cx="32" cy="56" rx="16" ry="6" fill="#000000" opacity="0.35" />

  <!-- Backpack (Behind shoulders) -->
  <rect x="18" y="22" width="28" height="24" rx="5" fill="#78350f" stroke="#451a03" stroke-width="2" />
  <rect x="20" y="19" width="24" height="6" rx="3" fill="#d97706" stroke="#451a03" stroke-width="1.5" />
  <rect x="24" y="19" width="3" height="6" fill="#451a03" />
  <rect x="37" y="19" width="3" height="6" fill="#451a03" />

  <!-- Hiking Boots -->
  <rect x="20" y="49" width="10" height="7" rx="2" fill="#5c2e0b" stroke="#271304" stroke-width="1.5" />
  <rect x="19" y="53" width="12" height="3" rx="1" fill="#271304" />
  <rect x="34" y="49" width="10" height="7" rx="2" fill="#5c2e0b" stroke="#271304" stroke-width="1.5" />
  <rect x="33" y="53" width="12" height="3" rx="1" fill="#271304" />

  <!-- Blue Jeans -->
  <path d="M 21 38 L 21 50 L 30 50 L 31 43 L 33 43 L 34 50 L 43 50 L 43 38 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5" />
  <!-- Jean Seams & Pockets -->
  <path d="M 23 41 C 26 43 28 43 29 41" fill="none" stroke="#fbbf24" stroke-width="0.8" />
  <path d="M 35 41 C 36 43 38 43 41 41" fill="none" stroke="#fbbf24" stroke-width="0.8" />

  <!-- Leather Belt & Buckle -->
  <rect x="20" y="36" width="24" height="3.5" rx="1" fill="#78350f" />
  <rect x="29" y="35.5" width="6" height="4.5" rx="1" fill="#fbbf24" stroke="#d97706" stroke-width="0.8" />

  <!-- Flannel Shirt Torso (Red Buffalo Plaid) -->
  <rect x="20" y="24" width="24" height="13" rx="2" fill="#dc2626" />
  <!-- Plaid Checks -->
  <rect x="20" y="27" width="24" height="3" fill="#991b1b" />
  <rect x="20" y="33" width="24" height="3" fill="#991b1b" />
  <rect x="25" y="24" width="4" height="13" fill="#991b1b" />
  <rect x="35" y="24" width="4" height="13" fill="#991b1b" />
  <!-- Intersection Checks -->
  <rect x="25" y="27" width="4" height="3" fill="#1e293b" />
  <rect x="25" y="33" width="4" height="3" fill="#1e293b" />
  <rect x="35" y="27" width="4" height="3" fill="#1e293b" />
  <rect x="35" y="33" width="4" height="3" fill="#1e293b" />

  <!-- Flannel Button Placket & Collar -->
  <rect x="30.5" y="24" width="3" height="13" fill="#b91c1c" />
  <circle cx="32" cy="27" r="0.9" fill="#fef08a" />
  <circle cx="32" cy="30.5" r="0.9" fill="#fef08a" />
  <circle cx="32" cy="34" r="0.9" fill="#fef08a" />
  <path d="M 27 24 L 32 27 L 37 24" fill="none" stroke="#fecaca" stroke-width="1.2" />

  <!-- Backpack Shoulder Straps Over Chest -->
  <rect x="22" y="24" width="3.5" height="13" rx="1" fill="#5c2e0b" stroke="#451a03" stroke-width="0.8" />
  <rect x="38.5" y="24" width="3.5" height="13" rx="1" fill="#5c2e0b" stroke="#451a03" stroke-width="0.8" />
  <rect x="22" y="29" width="3.5" height="2" fill="#fbbf24" />
  <rect x="38.5" y="29" width="3.5" height="2" fill="#fbbf24" />

  <!-- Arms with Flannel Sleeves & Hands -->
  <rect x="15.5" y="25" width="5" height="11" rx="2" fill="#dc2626" />
  <rect x="15.5" y="33.5" width="5" height="2.5" fill="#991b1b" />
  <circle cx="18" cy="38" r="2.5" fill="#fed7aa" />

  <rect x="43.5" y="25" width="5" height="11" rx="2" fill="#dc2626" />
  <rect x="43.5" y="33.5" width="5" height="2.5" fill="#991b1b" />
  <circle cx="46" cy="38" r="2.5" fill="#fed7aa" />

  <!-- Head & Face -->
  <circle cx="32" cy="16" r="9.5" fill="#fed7aa" />
  <!-- Cheerful Eyes -->
  <ellipse cx="28.5" cy="16" rx="1.6" ry="2" fill="#0f172a" />
  <circle cx="28" cy="15.3" r="0.6" fill="#ffffff" />
  <ellipse cx="35.5" cy="16" rx="1.6" ry="2" fill="#0f172a" />
  <circle cx="35" cy="15.3" r="0.6" fill="#ffffff" />
  <!-- Smile -->
  <path d="M 30 19.5 Q 32 21.5 34 19.5" fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" />

  <!-- Messy Brown Hair -->
  <path d="M 22 15 C 22 8 42 8 42 15 C 43 12 41 9 39 8 C 36 6 28 6 25 8 C 23 10 22 13 22 15 Z" fill="#451a03" />
  <path d="M 22 14 C 20 16 21 19 22 20 C 23 18 24 16 25 15 Z" fill="#451a03" />
  <path d="M 42 14 C 44 16 43 19 42 20 C 41 18 40 16 39 15 Z" fill="#451a03" />
  <!-- Hair Tufts / Bangs -->
  <path d="M 24 12 Q 28 15 31 12 Q 35 16 38 12 Q 40 14 41 12 C 40 9 24 9 24 12 Z" fill="#5c2406" />
</svg>
